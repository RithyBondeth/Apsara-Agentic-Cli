name: CI

on:
  # Pull requests validate feature branches. Direct pushes only need a second
  # run on release-bearing branches; this avoids duplicate push + PR matrices.
  push:
    branches: [main, "private-alpha-*"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test portable core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_runtime.py tests/test_checkpoints.py tests/test_history.py tests/test_session.py tests/test_ui_markdown.py tests/test_professional_features.py tests/test_bash_safety.py tests/test_workspace.py
          apsara --version
          apsara --help

  pipx-lifecycle:
    name: pipx (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel and install pipx
        run: python -m pip install --upgrade pip build pipx
      - name: Build release wheel
        run: python -m build --wheel
      - name: Test install, first run, upgrade, and uninstall
        run: python scripts/pipx_smoke.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and validate the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the built wheel installs and runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/apsara --version
          /tmp/verify/bin/apsara --help
          /tmp/verify/bin/pip check

      - name: Audit installed dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit
