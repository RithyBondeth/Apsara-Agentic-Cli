[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apsara-agentic"
version = "0.1.0a1"
description = "Apsara Agentic - Local coding assistant CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bondeth" }]
keywords = ["ai", "agent", "cli", "coding-assistant", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "openai>=1.16.0",
  "litellm>=1.35.0",
  "httpx>=0.27.0",
  "mcp>=2.0.0",
  "tomli>=2.0.1; python_version < '3.11'",
  "rich>=13.7.0",
  "prompt_toolkit>=3.0.0",
  "pygments>=2.17.0",
]

[project.optional-dependencies]
intelligence = [
  "tree-sitter-language-pack>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
]
release = [
  "build>=1.2.0",
  "twine>=5.0.0",
]

[project.scripts]
apsara = "apsara_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apsara_cli*"]

[tool.setuptools.package-data]
"apsara_cli.engine" = ["bundled_skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
